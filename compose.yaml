# WahaBuddy local/production Compose stack (spec L2).
#
#   cp .env.example .env   (fill APP_URL + APP_KEY, see docs/deployment.md)
#   docker compose up -d --build
#   docker compose run --rm init php artisan wahabuddy:admin
#
# The SAME application image serves app/worker/scheduler/init. Migrations run
# once in `init` before the long-running services start.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wahabuddy}
      MYSQL_USER: ${DB_USERNAME:-wahabuddy}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${DB_USERNAME:-wahabuddy}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: wahabuddy-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment: &app-env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?set APP_URL in .env}
      APP_KEY: ${APP_KEY:?set APP_KEY in .env — generate once and keep it stable}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-wahabuddy}
      DB_USERNAME: ${DB_USERNAME:-wahabuddy}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      MEDIA_DISK: ${MEDIA_DISK:-public}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      AWS_URL: ${AWS_URL:-}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
    volumes:
      - app-storage:/var/www/html/storage
      - app-public:/var/www/html/public
    healthcheck:
      test: ["CMD", "php", "artisan", "--no-interaction", "help", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    image: wahabuddy-app
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment: *app-env
    volumes:
      - app-storage:/var/www/html/storage
    command: ["php", "artisan", "queue:work", "--queue=default", "--sleep=1", "--tries=1", "--timeout=180"]
    stop_grace_period: 200s

  scheduler:
    image: wahabuddy-app
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment: *app-env
    volumes:
      - app-storage:/var/www/html/storage
    # schedule:work runs the every-minute dispatcher in-process; no host cron
    # needed. Do NOT also run a host cron `schedule:run` against this stack.
    command: ["php", "artisan", "schedule:work"]

  init:
    image: wahabuddy-app
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    volumes:
      - app-storage:/var/www/html/storage
    # Idempotent one-shot: migrate + storage link. Never seeds/resets users.
    command: ["sh", "-c", "php artisan migrate --force && php artisan storage:link || true"]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/html/public:ro
      - app-storage:/var/www/html/storage:ro

volumes:
  db-data:
  app-storage:
  app-public:
