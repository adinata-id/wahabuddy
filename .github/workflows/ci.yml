name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install Composer dependencies (locked)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate wayfinder route helpers
        run: php artisan wayfinder:generate --with-form

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (vite-plus check)
        run: npm run check

      - name: Build
        run: npm run build

  php:
    name: PHP ${{ matrix.php }} (MySQL, all outbound WAHA faked)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wahabuddy_testing
          MYSQL_USER: wahabuddy
          MYSQL_PASSWORD: wahabuddy
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, bcmath, intl, zip, pdo_mysql, exif
          coverage: none

      - name: Install Composer dependencies (locked)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate wayfinder route helpers
        run: php artisan wayfinder:generate --with-form

      - name: Copy .env for the app key
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          # Tests talk to the matrix MySQL service directly.
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env

      - name: PHPStan (level 7)
        run: composer types:check

      - name: Pint (lint)
        run: vendor/bin/pint --test

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets (page-render tests need the Vite manifest)
        run: |
          npm ci
          npm run build

      - name: Tests (unit + feature + integration, MySQL)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: wahabuddy_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
